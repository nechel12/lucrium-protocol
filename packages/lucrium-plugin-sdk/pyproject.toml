[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "lucrium-plugin-sdk"
version = "0.1.3"
description = "Lucrium Plugin SDK: PluginContext, контракт on_start/on_event/on_stop, рантайм и инструменты тестирования плагинов."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "nechel12" }]
keywords = ["lucrium", "plugin", "sdk", "funpay", "playerok"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "lucrium-protocol>=0.1.0",
]

[project.urls]
Repository = "https://github.com/nechel12/lucrium-protocol"
Documentation = "https://github.com/nechel12/lucrium-protocol/blob/main/packages/lucrium-plugin-sdk/docs/writing-plugins.md"

[tool.uv.sources]
lucrium-protocol = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/lucrium_plugin_sdk"]
