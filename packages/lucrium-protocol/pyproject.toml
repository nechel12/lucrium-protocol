[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "lucrium-protocol"
version = "0.1.0"
description = "Lucrium Protocol: модели протокола «панель ↔ воркер», манифесты и дескрипторы плагинов, JWT-лицензии, JSON-RPC IPC."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "nechel12" }]
keywords = ["lucrium", "funpay", "playerok", "ggsel", "protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.10,<3",
    "pyjwt[crypto]>=2.10",
]

[project.urls]
Repository = "https://github.com/nechel12/lucrium-protocol"

[tool.hatch.build.targets.wheel]
packages = ["src/lucrium_protocol"]
